[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick sanity/smoke checks
    regression: Full regression suite
    uds: UDS service layer tests
    dtc: DTC read/clear/snapshot tests
    bluetooth: Bluetooth feature tests
    usb_media: USB / media playback tests
    radio: Radio / tuner tests
    navigation: Navigation / GPS tests
    voice: Voice recognition tests
    display: Display / HMI tests
    audio: Audio amplifier tests
    projection: CarPlay / Android Auto tests
    ota: OTA / software update tests
    network: Network connectivity / Wi-Fi tests
    negative: Negative response / error path tests
    security: Security access tests
    io_control: IO Control by Identifier tests
    parametrize: Parametrized DID/DTC coverage tests

addopts = -v --tb=short --strict-markers

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

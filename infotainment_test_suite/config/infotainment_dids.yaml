gps_fix_status:
  id: "0x3060"
  length: 1
  writable: false
  session: extended
  description: "GNSS fix type (0=no fix, 1=2D, 2=3D, 3=DGPS)"
  decode:
    type: enum
    values:
      0x00: "no_fix"
      0x01: "2D_fix"
      0x02: "3D_fix"
      0x03: "DGPS_fix"

gps_latitude:
  id: "0x3061"
  length: 4
  writable: false
  session: extended
  description: "GPS latitude as signed 32-bit integer (degree × 1e-7)"
  decode: { type: bytes }

gps_longitude:
  id: "0x3062"
  length: 4
  writable: false

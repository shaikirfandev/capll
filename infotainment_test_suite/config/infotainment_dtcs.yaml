# ============================================================
# Infotainment ECU — DTC Catalogue
# ============================================================
#
# How to populate from real sources:
#   - Import from supplier DTC catalogue (Excel/CSV)
#   - Cross-reference with FMEA / FTA for severity classification
#   - Verify DTC codes against ODX DiagTroubleCodeProp
#
# Field guide:
#   code               — 3-byte DTC hex string (ISO/SAE format prefix auto-derived)
#   iso_code           — human-readable ISO code  e.g. "B11001"
#   description        — short fault description
#   severity           — critical | major | minor | info
#   fault_type         — hardware | software | communication | calibration | configuration
#   system             — ECU subsystem that generates this DTC
#   status_bits        — which status bits can be set (comma list of bit names)
#   expected_on_clean  — false = DTC must NOT be confirmed on a healthy ECU bench
#   freeze_frame_dids  — DIDs captured in the freeze frame record
# ============================================================


# ============================================================
# Cluster ECU Configuration  (Instrument Cluster / IPC)
# ============================================================
# The cluster ECU typically lives on the Body/Comfort CAN network at
# 500 kbps.  Populate IDs from the DBC file or ODX/AUTOSAR ComStack
# generated by your supplier toolchain (e.g., Vector DaVinci, ETAS ISOLAR).

# ── CAN / transport layer ──────────────────────────────────
can:
  channel:  1
  bitrate:  500000
  can_fd:   false
  fd_bitrate: 2000000
  tx_id:  "0x720"        # Tester → Cluster ECU  (from DBC DIAG_PHYS_IPC_REQ)
  rx_id:  "0x728"        # Cluster ECU → Tester  (DIAG_PHYS_IPC_RSP)
  func_id: "0x7DF"       # Functional broadcast

# ── UDS sessions ──────────────────────────────────────────
sessions:
  default:     0x01
  extended:    0x03
  programming: 0x02

# ── Security access ────────────────────────────────────────
security_access:
  level: 0x01
  algorithm: "xor_placeholder"

# ── DIDs ──────────────────────────────────────────────────
dids:
  software_version:
    id: "0xF189"
    length: 20
    writable: false
    description: "Cluster software version string"

  hardware_version:
    id: "0xF191"
    length: 10
    writable: false
    description: "Cluster hardware part number"

  vin:
    id: "0xF190"
    length: 17
    writable: false
    description: "Vehicle Identification Number (programmed at EOL)"

  odometer:
    id: "0x4001"          # Supplier-specific — extract from ODX DID catalogue
    length: 4
    writable: false
    description: "Odometer reading in kilometres (unsigned 32-bit, resolution 0.1 km)"

  vehicle_speed:
    id: "0x4002"
    length: 2
    writable: false
    description: "Vehicle speed signal from CAN bus (km/h, resolution 0.1)"

  engine_speed:
    id: "0x4003"
    length: 2
    writable: false
    description: "Engine speed (RPM) forwarded to cluster display"

  warning_lamp_states:
    id: "0x4010"
    length: 4
    writable: false
    description: "Bitfield of active warning lamps (see supplier DID spec)"

  fuel_level:
    id: "0x4020"
    length: 2
    writable: false
    description: "Fuel level percentage (0–100)"

  coolant_temperature:
    id: "0x4021"
    length: 2
    writable: false
    description: "Coolant temperature in °C (offset -40)"

  backlight_level:
    id: "0x4030"
    length: 1
    writable: true
    description: "Cluster backlight PWM level (0–255)"

# ── IO Control DIDs ────────────────────────────────────────
# Used with service 0x2F (InputOutputControlByIdentifier)
io_control:
  check_engine_lamp:
    did: "0x4011"
    control_option_on:  "0x0301"   # returnControlToECU=0x00, shortTermAdjustment=0x03
    control_option_off: "0x0300"
    description: "Force Check Engine (MIL) lamp ON/OFF for functional test"

  speed_gauge:
    did: "0x4012"
    control_option_on:  "0x0340"   # Set gauge to 40 km/h needle position
    control_option_off: "0x0300"
    description: "Force speed gauge pointer to test position"

# ── Routines ──────────────────────────────────────────────
routines:
  display_test_pattern:
    id: "0x0401"
    description: "Activate cluster display test pattern (all segments)"
    expected_status: 0x00

  gauge_sweep_test:
    id: "0x0402"
    description: "Perform full gauge needle sweep for functional verification"
    expected_status: 0x00

  odometer_checksum_verify:
    id: "0x0403"
    description: "Verify odometer NVM checksum integrity"
    expected_status: 0x00

# ── DTC map ────────────────────────────────────────────────
dtc_map:
  "0xU03001": "CAN bus-off — Cluster network segment"
  "0xU03002": "Lost communication with Body Control Module"
  "0xU03003": "Lost communication with Engine Control Module"
  "0xB20001": "Gauge stepper motor — speedometer stuck"
  "0xB20002": "Gauge stepper motor — tachometer stuck"
  "0xB20003": "Gauge stepper motor — fuel gauge fault"
  "0xB21001": "Cluster display backlight driver fault"
  "0xB21002": "Cluster display pixel driver fault"
  "0xB22001": "Warning lamp driver open circuit"
  "0xB22002": "Warning lamp driver short to battery"

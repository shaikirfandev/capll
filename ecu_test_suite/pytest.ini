[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    adas: ADAS ECU domain test cases
    infotainment: Infotainment ECU domain test cases
    cluster: Cluster ECU domain test cases
    telematics: Telematics ECU domain test cases
    smoke: Quick smoke / sanity checks
    regression: Full regression suite
    uds: Generic UDS service tests
    security: Security access tests
    dtc: DTC read/clear tests
    functional: Domain-specific functional validation

addopts = -v --tb=short --strict-markers

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s — %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

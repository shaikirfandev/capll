# =============================================================================
# sonar-project.properties — SonarQube analysis config
# =============================================================================

sonar.projectKey=tcu_validation_framework
sonar.projectName=TCU Validation Framework
sonar.projectVersion=2.0.0

# Source & tests
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
    **/build/**,\
    **/third_party/**,\
    **/.cache/**

sonar.test.exclusions=\
    **/build/**

# C++ specific
sonar.cfamily.build-wrapper-output=bw-output
sonar.cfamily.gcov.reportsPath=reports
sonar.cfamily.threads=4

# Coverage
sonar.cfamily.cobertura.reportPaths=reports/coverage-cobertura.xml

# Test results
sonar.testExecutionReportPaths=\
    reports/unit_tests.xml,\
    reports/integration_tests.xml

# Quality gate
sonar.qualitygate.wait=true

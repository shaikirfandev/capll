[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    uds:          Generic UDS service tests (0x10, 0x11, 0x22, etc.)
    regression:   Per-release regression comparison tests
    security:     Security access (0x27) tests
    dtc:          DTC read/clear tests (0x14, 0x19)
    adas:         ADAS ECU domain tests
    infotainment: Infotainment ECU domain tests
    smoke:        Quick sanity checks (subset of regression suite)

addopts = -v --tb=short --strict-markers

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

[pytest]
addopts = -ra --strict-config --strict-markers --tb=short
testpaths = tests
xfail_strict = true
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
markers =
    unit: Unit-level verification
    component: Component-level verification
    integration: Integration verification
    system: System-level verification
    regression: Full regression coverage
    smoke: Fast confidence checks
    boundary: Boundary and limit tests
    negative: Negative and misuse scenarios
    fault_injection: Fault injection coverage
    acc: Adaptive cruise control tests
    aeb: Automatic emergency braking tests
    lka: Lane keep assist tests
    fcw: Forward collision warning tests
    bsd: Blind spot detection tests
    diagnostics: UDS and DTC diagnostics tests
    safety: Functional safety and degradation tests
